# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source: GitHub Actions) if not already enabled
          enablement: true
      - name: Prepare site
        run: |
          mkdir site
          cp page/bpmnEditorOnLine.html site/index.html
          cp -r page/lib site/lib
          cp page/bpmnEditor.html site/bpmnEditor.html
          cp page/bpmnSample.html site/bpmnSample.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the light editor (loads lib/) as the site root, plus the
          # standalone pages as downloadables
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
