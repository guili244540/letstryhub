<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPMN Editor with external links</title>
</head>
<body>
  <header>
    <h1>BPMN Editor</h1>
    <input type="file" id="open-file" accept=".bpmn,.xml" hidden />
    <button id="open">Open BPMN</button>
    <button id="save">Save BPMN</button>
    <button id="export">Export page</button>
    <button id="download-standalone">Download standalone editor</button>
    <button id="toggle-panel" aria-pressed="false">Properties</button>
    <span id="status"></span>
  </header>
  <main>
    <div id="canvas"></div>
    <aside id="properties-panel" style="display:none"></aside>
  </main>
  <script type="module" src="/src/modeler.js"></script>
</body>
</html>
