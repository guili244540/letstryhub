<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BPMN (editable diagram with external links)</title>
    <!--
      Light variant: the bpmn-js library and styles are loaded from lib/
      next to this page, so this file stays small. It works offline via
      file:// as long as the lib/ folder travels with it. The "Export page"
      button needs to fetch lib/ files, which browsers only allow when the
      page is served over HTTP; on file:// it shows a message instead.

      scripts/inline-lib.mjs generates the fully standalone page/bpmnEditor.html
      from this file (assets inlined, viewer library embedded as a JSON blob
      so the export button works anywhere). Edit this file, not that one.
    -->

    <!-- Modeler bundle: viewer + palette + editing tools -->
    <script src="lib/bpmn-modeler.development.js"></script>
    <!-- Extra modules: "..." create/append menu + color picker brush -->
    <script src="lib/bpmn-js-extras.js"></script>

    <!-- Both stylesheets are required:
         diagram-js.css styles outlines, palette, context pad, popups
         bpmn-js.css styles the BPMN shapes themselves -->
    <link rel="stylesheet" href="lib/diagram-js.css">
    <link rel="stylesheet" href="lib/bpmn-js.css">
    <!-- Font used by the palette / context pad icons -->
    <link rel="stylesheet" href="lib/bpmn-embedded.css">
    <!-- Color picker popup layout (swatches are inline SVG) -->
    <link rel="stylesheet" href="lib/color-picker.css">

    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        header {
            display: flex; align-items: center; gap: 1rem;
            padding: 0.5rem 1rem; border-bottom: 1px solid #ddd;
        }
        header h1 { font-size: 1rem; margin: 0; }
        #status { color: #666; font-size: 0.85rem; }
        /* Toolbar buttons next to the title. */
        header button {
            font: inherit; font-size: 0.85rem; font-weight: 500;
            padding: 0.4rem 0.85rem; border: 1px solid #c9c9c9; border-radius: 6px;
            background: #fff; color: #333; cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        header button:hover { background: #f2f2f2; border-color: #aaa; }
        header button:focus-visible { outline: 2px solid #7aa5e0; outline-offset: 1px; }
        header button:active { background: #e6e6e6; }
        #save { background: #1a73e8; border-color: #1a73e8; color: #fff; }
        #save:hover { background: #1666d0; border-color: #1666d0; }
        #save:active { background: #1257b8; }
        #export { background: #f4f9ee; border-color: #a8d08d; color: #2f6b1f; }
        #export:hover { background: #e8f3dd; border-color: #86bd63; }
        #export:active { background: #d8ecbe; }
        main { flex: 1; display: flex; min-height: 0; }
        #canvas { flex: 1; min-width: 0; border: 1px solid #ddd; position: relative; }
        #properties-panel {
            width: 250px; border-left: 1px solid #ddd; padding: 1rem;
            box-sizing: border-box;
        }
        #properties-panel h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
        #properties-panel label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; font-weight: 600; }
        #properties-panel input, #properties-panel textarea { width: 100%; margin-bottom: 0.5rem; box-sizing: border-box; font: inherit; }
        #properties-panel textarea { resize: vertical; min-height: 4.5rem; }
        #properties-panel h4 { margin: 0.75rem 0 0; font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; }
        /* Popup shown when hovering an element that has a comment */
        #comment-popup {
            position: fixed; z-index: 1000;
            max-width: 300px; max-height: 200px; overflow: auto;
            padding: 0.5rem 0.75rem;
            background: #fffde7; border: 1px solid #d4c65c; border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
            font-size: 0.85rem; white-space: pre-wrap;
            pointer-events: none;
        }
        #toggle-panel.active { background: #dce8ff; border-color: #7aa5e0; color: #1a56b0; }
        /* Zoom control strip, above the bpmn.io watermark */
        .zoom-controls {
            position: absolute; right: 15px; bottom: 80px;
            display: flex; flex-direction: column;
            background: #fff; border: 1px solid #ccc; border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,.15); overflow: hidden; z-index: 20;
        }
        .zoom-controls button {
            width: 30px; height: 30px; padding: 0; border: none;
            background: #fff; color: #444;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .zoom-controls button + button { border-top: 1px solid #e8e8e8; }
        .zoom-controls button:hover { background: #f2f2f2; }
        .zoom-controls svg { width: 16px; height: 16px; }
        /* Must out-specify diagram-js's ".djs-element .djs-hit-* { cursor: move }" */
        .djs-element.has-link .djs-hit-stroke,
        .djs-element.has-link .djs-hit-click-stroke,
        .djs-element.has-link .djs-hit-all { cursor: pointer; }
        /* Elements carrying a link or a comment get a soft colored halo so
           they are recognizable without hovering: royal blue = link,
           amber = comment, violet = both. Purely additive: element colors
           are untouched. */
        .djs-element.has-link .djs-visual { filter: drop-shadow(0 0 4px rgba(65, 105, 225, 0.9)); }
        .djs-element.has-comment .djs-visual { filter: drop-shadow(0 0 4px rgba(204, 122, 0, 0.9)); }
        .djs-element.has-link.has-comment .djs-visual { filter: drop-shadow(0 0 4px rgba(123, 79, 184, 0.9)); }
    </style>
</head>
<body>
    <header>
        <h1>BPMN Editor</h1>
        <input type="file" id="open-file" accept=".bpmn,.xml" hidden>
        <button id="open">Open BPMN</button>
        <button id="save">Save BPMN</button>
        <button id="export">Export page</button>
        <button id="download-standalone">Download standalone editor</button>
        <button id="toggle-panel" aria-pressed="false">Properties</button>
        <span id="status"></span>
    </header>
    <main>
        <div id="canvas"></div>
        <aside id="properties-panel" style="display:none">
            <h3>Properties</h3>
            <p id="no-selection">Select an element to edit its properties.</p>
            <label for="link-input" id="link-label" style="display:none">Link</label>
            <input type="url" id="link-input" placeholder="https://example.org/docs" style="display:none">
            <label for="comment-input" id="comment-label" style="display:none">Comment</label>
            <textarea id="comment-input" rows="4" maxlength="1000" placeholder="Type a comment…" style="display:none"></textarea>
            <label for="prop-ehub-input" id="label-ehub-input" style="display:none">Input</label>
            <textarea id="prop-ehub-input" rows="2" maxlength="1000" placeholder="Input…" style="display:none"></textarea>
            <label for="prop-ehub-output" id="label-ehub-output" style="display:none">Output</label>
            <textarea id="prop-ehub-output" rows="2" maxlength="1000" placeholder="Output…" style="display:none"></textarea>
            <label for="prop-ehub-validation" id="label-ehub-validation" style="display:none">Validation</label>
            <textarea id="prop-ehub-validation" rows="2" maxlength="1000" placeholder="Validation…" style="display:none"></textarea>
            <label for="prop-ehub-exception" id="label-ehub-exception" style="display:none">Exception</label>
            <textarea id="prop-ehub-exception" rows="2" maxlength="1000" placeholder="Exception…" style="display:none"></textarea>
            <h4 id="implementation-heading" style="display:none">Implementation</h4>
            <label for="prop-ehub-implementationCurrent" id="label-ehub-implementationCurrent" style="display:none">Current</label>
            <textarea id="prop-ehub-implementationCurrent" rows="2" maxlength="1000" placeholder="Current…" style="display:none"></textarea>
            <label for="prop-ehub-implementationTarget" id="label-ehub-implementationTarget" style="display:none">Target</label>
            <textarea id="prop-ehub-implementationTarget" rows="2" maxlength="1000" placeholder="Target…" style="display:none"></textarea>
            <label for="prop-ehub-implementationTargetMethod" id="label-ehub-implementationTargetMethod" style="display:none">Target method</label>
            <textarea id="prop-ehub-implementationTargetMethod" rows="2" maxlength="1000" placeholder="Target method…" style="display:none"></textarea>
        </aside>
    </main>

    <!-- Diagram XML (same content as the viewer page) -->
    <script type="text/plain" id="bpmn-data">
<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:bioc="http://bpmn.io/schema/bpmn/biocolor/1.0" xmlns:color="http://www.omg.org/spec/BPMN/non-normative/color/1.0" xmlns:ehub="https://letstryhub.example/bpmn/ehub" id="Definitions_Fixtire" targetNamespace="http://bpmn.io/schema/bpmn">
  <bpmn:collaboration id="Collaboration_08az794">
    <bpmn:participant id="Participant_01tulrx" ehub:comment="BPMN Collaboration Pools (Participant Lanes)&#10;Driver Pool (Process_Fixcar): Represents the primary actor and internal workflow. Ranging from regular driving and self-diagnosis to carrying out minor repairs or requesting external help." name="Driver" processRef="Process_Fixcar" />
    <bpmn:participant id="Participant_0qex65i" ehub:comment="BPMN Collaboration Pools (Participant Lanes)&#10;Mobility Assistance Pool: Represents the external service provider&#39;s organization and operational workflow. It handles incoming assistance requests, dispatches on-site troubleshooting teams, provides response times, coordinates towing, and organizes replacement transport. Inter-pool communication is managed entirely via message flows." name="Mobility Assistance" processRef="Process_03yb2pl" />
    <bpmn:messageFlow id="Flow_1awdy3b" sourceRef="Event_0h3v8f6" targetRef="Event_1e4mj8z" />
    <bpmn:messageFlow id="Flow_0ouk452" sourceRef="Event_00kjgvw" targetRef="Event_0xcfh5l" />
    <bpmn:messageFlow id="Flow_TowRequest" targetRef="Event_ReceiveTowRequest" />
    <bpmn:messageFlow id="Flow_AssistanceDone" sourceRef="Event_AssistanceFinished" />
    <bpmn:messageFlow id="Flow_1jn3ng0" sourceRef="Event_1ioe1y6" targetRef="Event_AssistanceFinished" />
    <bpmn:messageFlow id="Flow_0tbd3bl" sourceRef="Event_0w9ny0f" targetRef="Event_09yrkva" />
    <bpmn:messageFlow id="Flow_0pw1yjg" sourceRef="Event_TuringPoint" targetRef="Event_ReceiveTowRequest" />
  </bpmn:collaboration>
  <bpmn:process id="Process_Fixcar" isExecutable="false">
    <bpmn:startEvent id="StartEvent_Driven" name="Car in motion">
      <bpmn:outgoing>Flow_1</bpmn:outgoing>
    </bpmn:startEvent>
    <bpmn:task id="Task_DetectProblem" name="Driving the car">
      <bpmn:incoming>Flow_1</bpmn:incoming>
      <bpmn:outgoing>Flow_0kyercl</bpmn:outgoing>
    </bpmn:task>
    <bpmn:exclusiveGateway id="Gateway_Repairable" ehub:comment="Exclusive (XOR) Gateway" name="DIY Repairs?">
      <bpmn:incoming>Flow_6</bpmn:incoming>
      <bpmn:outgoing>Flow_7</bpmn:outgoing>
      <bpmn:outgoing>Flow_8</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:endEvent id="Event_0cqsjrs" name="Journey completed">
      <bpmn:incoming>Flow_0kyercl</bpmn:incoming>
    </bpmn:endEvent>
    <bpmn:task id="Activity_18rj6j4" ehub:url="https://guichet.public.lu/en/citoyens/transport/transports-individuels/vehicule-motorise/controle-technique-pneumatiques/controle-technique-obligatoire-vehicule.html" ehub:comment="Abstract Task (triggered by the non-interrupting &#34;Strange noise / behaviour&#34; boundary event)&#10;This task represents the driver&#39;s assessment phase when an anomaly (such as a noise, shock, or vibration) is detected while the car is in motion. The driver evaluates the severity of the issue to decide whether it is safe to continue driving or if an immediate stop is required." name="Evaluate">
      <bpmn:incoming>Flow_0erl78o</bpmn:incoming>
      <bpmn:outgoing>Flow_06e6nac</bpmn:outgoing>
    </bpmn:task>
    <bpmn:exclusiveGateway id="Gateway_1gu9uf7" ehub:comment="Exclusive (XOR) Gateway&#10;This gateway evaluates the outcome of the driver&#39;s evaluation following an unusual noise, shock, or vibration.&#10;If &#34;Ok&#34;: The anomaly is deemed minor, allowing the driver to resume and complete the journey.&#10;If &#34;Not ok&#34;: The issue requires intervention, forcing the process to divert to the &#34;Stop and secure the vehicle&#34; task." name="How is it ?">
      <bpmn:incoming>Flow_06e6nac</bpmn:incoming>
      <bpmn:outgoing>Flow_1w48h6e</bpmn:outgoing>
      <bpmn:outgoing>Flow_1xzv3ug</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:sequenceFlow id="Flow_1" sourceRef="StartEvent_Driven" targetRef="Task_DetectProblem" />
    <bpmn:sequenceFlow id="Flow_0kyercl" sourceRef="Task_DetectProblem" targetRef="Event_0cqsjrs" />
    <bpmn:sequenceFlow id="Flow_2" name="pressure &#60; 1.5 bar" sourceRef="Event_1rew7ey" targetRef="Task_StopSecure" />
    <bpmn:sequenceFlow id="Flow_1xzv3ug" name="Not ok" sourceRef="Gateway_1gu9uf7" targetRef="Task_StopSecure" />
    <bpmn:sequenceFlow id="Flow_5" sourceRef="Task_StopSecure" targetRef="Task_InspectTire" />
    <bpmn:sequenceFlow id="Flow_6" sourceRef="Task_InspectTire" targetRef="Gateway_Repairable" />
    <bpmn:sequenceFlow id="Flow_7" name="Yes" sourceRef="Gateway_Repairable" targetRef="Task_RepairTire" />
    <bpmn:sequenceFlow id="Flow_8" name="No" sourceRef="Gateway_Repairable" targetRef="Task_ReplaceOrAssistance" />
    <bpmn:sequenceFlow id="Flow_0erl78o" name="noise, shock or vibration detected" sourceRef="Event_14w0ll0" targetRef="Activity_18rj6j4" />
    <bpmn:sequenceFlow id="Flow_06e6nac" sourceRef="Activity_18rj6j4" targetRef="Gateway_1gu9uf7" />
    <bpmn:sequenceFlow id="Flow_1w48h6e" name="Ok" sourceRef="Gateway_1gu9uf7" targetRef="EndEvent_JourneyResumed" />
    <bpmn:sequenceFlow id="Flow_1qij2u7" sourceRef="Task_ReplaceOrAssistance" targetRef="Activity_14loqq0" />
    <bpmn:sequenceFlow id="Flow_12" name="Yes" sourceRef="Gateway_SafeToDrive" targetRef="EndEvent_JourneyResumed" />
    <bpmn:sequenceFlow id="Flow_07rn8bh" sourceRef="Event_0xcfh5l" targetRef="Activity_14loqq0" />
    <bpmn:sequenceFlow id="Flow_11d9xkg" sourceRef="Task_ReplaceOrAssistance" targetRef="Event_0h3v8f6" />
    <bpmn:task id="Task_ReplaceOrAssistance" ehub:url="https://www.acl.lu/en/assistance/mobility-assistance/" name="Call Mobility assistance">
      <bpmn:incoming>Flow_8</bpmn:incoming>
      <bpmn:incoming>Flow_0to6oau</bpmn:incoming>
      <bpmn:outgoing>Flow_1qij2u7</bpmn:outgoing>
      <bpmn:outgoing>Flow_11d9xkg</bpmn:outgoing>
    </bpmn:task>
    <bpmn:task id="Activity_14loqq0" name="Waiting for assistance to arrive and fix the issue">
      <bpmn:incoming>Flow_1qij2u7</bpmn:incoming>
      <bpmn:incoming>Flow_07rn8bh</bpmn:incoming>
      <bpmn:outgoing>Flow_1s09kp2</bpmn:outgoing>
    </bpmn:task>
    <bpmn:sequenceFlow id="Flow_1s09kp2" sourceRef="Activity_14loqq0" targetRef="Activity_0ys0zml" />
    <bpmn:sequenceFlow id="Flow_ToDriverWait" sourceRef="Event_TuringPoint" targetRef="Activity_DriverWaitAssist" />
    <bpmn:sequenceFlow id="Flow_0wecllm" sourceRef="Task_RepairTire" targetRef="Gateway_0usqoy7" />
    <bpmn:sequenceFlow id="Flow_ToJourneyResumed" sourceRef="Activity_DriverWaitAssist" targetRef="EndEvent_JourneyResumed" />
    <bpmn:exclusiveGateway id="Gateway_SafeToDrive" ehub:comment="Exclusive (XOR) Gateway&#10;A decision point that aggregates the outcomes of either a self-performed or an external repair.&#10;If &#34;Yes&#34;: The driver proceeds directly to complete the journey.&#10;If &#34;No&#34;: The vehicle cannot be safely driven; the process redirects to the towing and transport request flow to arrange professional towing and a rental vehicle handover." name="Vehicle safe to drive?">
      <bpmn:incoming>Flow_1soj3qf</bpmn:incoming>
      <bpmn:outgoing>Flow_12</bpmn:outgoing>
      <bpmn:outgoing>Flow_1tb2mqa</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:sequenceFlow id="Flow_1tb2mqa" name="No" sourceRef="Gateway_SafeToDrive" targetRef="Event_TuringPoint" />
    <bpmn:sequenceFlow id="Flow_1soj3qf" sourceRef="Activity_0ys0zml" targetRef="Gateway_SafeToDrive" />
    <bpmn:sequenceFlow id="Flow_1pvedn7" sourceRef="Event_09yrkva" targetRef="Activity_0ys0zml" />
    <bpmn:task id="Activity_0ys0zml" name="Assess Repair Report &#38; Driveability">
      <bpmn:incoming>Flow_1s09kp2</bpmn:incoming>
      <bpmn:incoming>Flow_1pvedn7</bpmn:incoming>
      <bpmn:outgoing>Flow_1soj3qf</bpmn:outgoing>
    </bpmn:task>
    <bpmn:adHocSubProcess id="Task_RepairTire" ehub:comment="Ad-Hoc Sub-process&#10;Representing the DIY fix, this container holds a set of independent tasks. Because it is an ad-hoc sub-process, these internal tasks do not enforce a strict sequential flow; they can be performed in any logical order, repeated, or skipped as required by the driver until the repair is complete." name="Repair">
      <bpmn:incoming>Flow_7</bpmn:incoming>
      <bpmn:outgoing>Flow_0wecllm</bpmn:outgoing>
      <bpmn:task id="Activity_03x6mpk" name="Inspect Damaged Component More Closely" />
      <bpmn:task id="Activity_0tfjmof" name="Retrieve Tools and Equipment" />
      <bpmn:task id="Activity_0l6huz6" name="Lift Vehicle" />
      <bpmn:task id="Activity_009xvnc" name="Apply Patch / Sealant or Change Wheel" />
      <bpmn:task id="Activity_1q5t6c6" name="Inflate / Adjust Tire Pressure" />
      <bpmn:task id="Activity_1exnhel" name="Secure Lug Nuts and Stow Equipment" />
    </bpmn:adHocSubProcess>
    <bpmn:intermediateThrowEvent id="Event_TuringPoint" name="Request towing &#38; transport">
      <bpmn:incoming>Flow_1tb2mqa</bpmn:incoming>
      <bpmn:outgoing>Flow_ToDriverWait</bpmn:outgoing>
      <bpmn:messageEventDefinition id="MessageEventDefinition_TowingReq" />
    </bpmn:intermediateThrowEvent>
    <bpmn:sequenceFlow id="Flow_0anxhtr" sourceRef="Event_AssistanceFinished" targetRef="Activity_DriverWaitAssist" />
    <bpmn:task id="Activity_DriverWaitAssist" name="Wait for towing &#38; rental handover">
      <bpmn:incoming>Flow_ToDriverWait</bpmn:incoming>
      <bpmn:incoming>Flow_0anxhtr</bpmn:incoming>
      <bpmn:outgoing>Flow_ToJourneyResumed</bpmn:outgoing>
    </bpmn:task>
    <bpmn:endEvent id="EndEvent_JourneyResumed" name="Journey resumed">
      <bpmn:incoming>Flow_12</bpmn:incoming>
      <bpmn:incoming>Flow_1w48h6e</bpmn:incoming>
      <bpmn:incoming>Flow_ToJourneyResumed</bpmn:incoming>
      <bpmn:incoming>Flow_0tb2ou1</bpmn:incoming>
    </bpmn:endEvent>
    <bpmn:intermediateThrowEvent id="Event_0h3v8f6" ehub:comment="Intermediate Message Throw Event / Message Flow&#10;Triggered when the driver determines that roadside repairs cannot be performed independently and opts to call for professional help. This event transmits an explicit assistance request message across pools from the Driver process directly into the Mobility Assistance start event, initiating the external service provider&#39;s dispatch sequence." name="Assistance request">
      <bpmn:incoming>Flow_11d9xkg</bpmn:incoming>
      <bpmn:messageEventDefinition id="MessageEventDefinition_11jv7cl" />
    </bpmn:intermediateThrowEvent>
    <bpmn:intermediateCatchEvent id="Event_0xcfh5l">
      <bpmn:outgoing>Flow_07rn8bh</bpmn:outgoing>
      <bpmn:messageEventDefinition id="MessageEventDefinition_0khwrcd" />
    </bpmn:intermediateCatchEvent>
    <bpmn:intermediateCatchEvent id="Event_09yrkva">
      <bpmn:outgoing>Flow_1pvedn7</bpmn:outgoing>
      <bpmn:messageEventDefinition id="MessageEventDefinition_1w3wijp" />
    </bpmn:intermediateCatchEvent>
    <bpmn:intermediateCatchEvent id="Event_AssistanceFinished" name="Receive completion notice">
      <bpmn:outgoing>Flow_0anxhtr</bpmn:outgoing>
      <bpmn:messageEventDefinition id="MessageEventDefinition_AssistanceDone" />
    </bpmn:intermediateCatchEvent>
    <bpmn:subProcess id="Task_StopSecure" ehub:comment="&#34;Stop and secure the vehicle&#34; collapsed Sub-Process (indicated by the plus sign or general container icon, representing a contained set of safety and immobilization steps)&#10;As a collapsed sub-process, it encapsulates the detailed sequence of pulling over safely, engaging parking brakes, activating hazard lights..." name="Stop and secure the vehicle">
      <bpmn:incoming>Flow_2</bpmn:incoming>
      <bpmn:incoming>Flow_1xzv3ug</bpmn:incoming>
      <bpmn:outgoing>Flow_5</bpmn:outgoing>
      <bpmn:task id="Activity_0o7hzwn" name="Decelerate and pull over safely">
        <bpmn:incoming>Flow_07g9yqo</bpmn:incoming>
        <bpmn:outgoing>Flow_1pp9jit</bpmn:outgoing>
      </bpmn:task>
      <bpmn:startEvent id="Event_1qug0qh" name="Emergency Stop Required">
        <bpmn:outgoing>Flow_07g9yqo</bpmn:outgoing>
      </bpmn:startEvent>
      <bpmn:sequenceFlow id="Flow_07g9yqo" sourceRef="Event_1qug0qh" targetRef="Activity_0o7hzwn" />
      <bpmn:task id="Activity_1vxpss9" name="Engage hazard warning lights and parking brake">
        <bpmn:incoming>Flow_1pp9jit</bpmn:incoming>
        <bpmn:outgoing>Flow_0rpixcc</bpmn:outgoing>
      </bpmn:task>
      <bpmn:sequenceFlow id="Flow_1pp9jit" sourceRef="Activity_0o7hzwn" targetRef="Activity_1vxpss9" />
      <bpmn:exclusiveGateway id="Gateway_17z0jpk" name="Is it dark or low visibility?">
        <bpmn:incoming>Flow_0rpixcc</bpmn:incoming>
        <bpmn:outgoing>Flow_10fsxjr</bpmn:outgoing>
        <bpmn:outgoing>Flow_18q0zhl</bpmn:outgoing>
      </bpmn:exclusiveGateway>
      <bpmn:sequenceFlow id="Flow_0rpixcc" sourceRef="Activity_1vxpss9" targetRef="Gateway_17z0jpk" />
      <bpmn:task id="Activity_0my3547" name="Put on high-visibility safety vest and place warning triangle">
        <bpmn:incoming>Flow_10fsxjr</bpmn:incoming>
        <bpmn:outgoing>Flow_1ki1484</bpmn:outgoing>
      </bpmn:task>
      <bpmn:sequenceFlow id="Flow_10fsxjr" sourceRef="Gateway_17z0jpk" targetRef="Activity_0my3547" />
      <bpmn:endEvent id="Event_108p76v">
        <bpmn:incoming>Flow_1ki1484</bpmn:incoming>
        <bpmn:incoming>Flow_18q0zhl</bpmn:incoming>
      </bpmn:endEvent>
      <bpmn:sequenceFlow id="Flow_1ki1484" sourceRef="Activity_0my3547" targetRef="Event_108p76v" />

    </script>

    <script>
        // Custom BPMN extension: an ehub:url attribute valid on any element.
        // It is stored inside the .bpmn file itself, so the viewer page can
        // read it too (even without this descriptor, via $attrs).
        const ehubModdle = {
            name: 'Ehub',
            prefix: 'ehub',
            uri: 'https://letstryhub.example/bpmn/ehub',
            xml: { tagAlias: 'lowerCase' },
            types: [
                {
                    name: 'Linked',
                    extends: [ 'bpmn:BaseElement' ],
                    properties: [
                        { name: 'url', isAttr: true, type: 'String' },
                        { name: 'comment', isAttr: true, type: 'String' },
                        { name: 'input', isAttr: true, type: 'String' },
                        { name: 'output', isAttr: true, type: 'String' },
                        { name: 'validation', isAttr: true, type: 'String' },
                        { name: 'exception', isAttr: true, type: 'String' },
                        { name: 'implementationCurrent', isAttr: true, type: 'String' },
                        { name: 'implementationTarget', isAttr: true, type: 'String' },
                        { name: 'implementationTargetMethod', isAttr: true, type: 'String' }
                    ]
                }
            ]
        };

        const modeler = new BpmnJS({
            container: '#canvas',
            moddleExtensions: { ehub: ehubModdle },
            additionalModules: [
                BpmnJsExtras.CreateAppendAnythingModule,
                BpmnJsExtras.colorPickerModule
            ],
            keyboard: { bindTo: document }
        });

        const statusEl = document.getElementById('status');
        const linkInput = document.getElementById('link-input');
        const linkLabel = document.getElementById('link-label');
        const commentInput = document.getElementById('comment-input');
        const commentLabel = document.getElementById('comment-label');
        const noSelection = document.getElementById('no-selection');

        const PROP_FIELDS = [
            'ehub:input',
            'ehub:output',
            'ehub:validation',
            'ehub:exception',
            'ehub:implementationCurrent',
            'ehub:implementationTarget',
            'ehub:implementationTargetMethod'
        ];
        const propInputs = {};
        const propLabels = {};
        PROP_FIELDS.forEach(function (attr) {
            propInputs[attr] = document.getElementById('prop-' + attr);
            propLabels[attr] = document.getElementById('label-' + attr);
        });
        const implementationHeading = document.getElementById('implementation-heading');

        function getUrl(element) {
            const bo = element.businessObject;
            return (bo && (bo.get('ehub:url') || bo.$attrs['ehub:url'])) || '';
        }

        function getComment(element) {
            const bo = element.businessObject;
            return (bo && (bo.get('ehub:comment') || bo.$attrs['ehub:comment'])) || '';
        }

        function getProp(element, attr) {
            const bo = element.businessObject;
            return (bo && (bo.get(attr) || bo.$attrs[attr])) || '';
        }

        async function openDiagram(xml) {
            try {
                await modeler.importXML(xml);
                statusEl.textContent = 'Diagram loaded.';
                markContentElements();
            } catch (err) {
                statusEl.textContent = 'Failed to load: ' + err.message;
                console.error(err);
            }
        }

        function markContentElements() {
            const canvas = modeler.get('canvas');
            const registry = modeler.get('elementRegistry');
            registry.getAll().forEach((element) => {
                if (element.labelTarget) return;
                if (getUrl(element)) { canvas.addMarker(element, 'has-link'); }
                if (getComment(element)) { canvas.addMarker(element, 'has-comment'); }
            });
        }

        // --- Open / Save -------------------------------------------------

        document.getElementById('open').addEventListener('click', () => {
            document.getElementById('open-file').click();
        });

        document.getElementById('open-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                file.text().then(openDiagram);
            }
            e.target.value = '';
        });

        document.getElementById('save').addEventListener('click', async () => {
            try {
                const { xml } = await modeler.saveXML({ format: true });
                var now = new Date();
                var pad = function (n) { return String(n).padStart(2, '0'); };
                var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
                       + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
                const fileName = 'BpmnSource' + ts;
                const blob = new Blob([ xml ], { type: 'application/xml' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${fileName}.bpmn`;
                a.click();
                URL.revokeObjectURL(a.href);
                statusEl.textContent = `Saved ${fileName}.bpmn.`;
            } catch (err) {
                statusEl.textContent = 'Failed to save: ' + err.message;
            }
        });

        // --- Properties side panel toggle -------------------------------

        document.getElementById('toggle-panel').addEventListener('click', () => {
            var panel = document.getElementById('properties-panel');
            var btn = document.getElementById('toggle-panel');
            var show = panel.style.display === 'none';
            panel.style.display = show ? '' : 'none';
            btn.classList.toggle('active', show);
            btn.setAttribute('aria-pressed', String(show));
        });

        // --- Link panel --------------------------------------------------

        const modeling = modeler.get('modeling');

        modeler.get('eventBus').on('selection.changed', (e) => {
            const selection = e.newSelection;
            const selected = selection.length === 1 ? selection[0] : null;
            if (selected) {
                noSelection.style.display = 'none';
                linkLabel.style.display = 'block';
                linkInput.style.display = 'block';
                linkInput.value = getUrl(selected);
                commentLabel.style.display = 'block';
                commentInput.style.display = 'block';
                commentInput.value = getComment(selected);
                implementationHeading.style.display = 'block';
                PROP_FIELDS.forEach(function (attr) {
                    propLabels[attr].style.display = 'block';
                    propInputs[attr].style.display = 'block';
                    propInputs[attr].value = getProp(selected, attr);
                });
            } else {
                noSelection.style.display = 'block';
                linkLabel.style.display = 'none';
                linkInput.style.display = 'none';
                commentLabel.style.display = 'none';
                commentInput.style.display = 'none';
                implementationHeading.style.display = 'none';
                PROP_FIELDS.forEach(function (attr) {
                    propLabels[attr].style.display = 'none';
                    propInputs[attr].style.display = 'none';
                });
            }
        });

        linkInput.addEventListener('change', () => {
            const selection = modeler.get('selection').get();
            if (selection.length !== 1) return;
            const element = selection[0];
            const value = linkInput.value || undefined;
            modeling.updateProperties(element, { 'ehub:url': value });
            modeler.get('canvas')[value ? 'addMarker' : 'removeMarker'](element, 'has-link');
        });

        commentInput.addEventListener('change', () => {
            const selection = modeler.get('selection').get();
            if (selection.length !== 1) return;
            const element = selection[0];
            const value = commentInput.value || undefined;
            modeling.updateProperties(element, { 'ehub:comment': value });
            modeler.get('canvas')[value ? 'addMarker' : 'removeMarker'](element, 'has-comment');
        });

        PROP_FIELDS.forEach(function (attr) {
            propInputs[attr].addEventListener('change', () => {
                const selection = modeler.get('selection').get();
                if (selection.length !== 1) return;
                modeling.updateProperties(selection[0], { [attr]: propInputs[attr].value || undefined });
            });
        });

        // --- Comment popup on hover (after ~1s) --------------------------

        const COMMENT_HOVER_DELAY = 1000;
        const commentPopup = document.createElement('div');
        commentPopup.id = 'comment-popup';
        commentPopup.style.display = 'none';
        document.body.appendChild(commentPopup);
        let hoverTimer = null;

        function showCommentPopup(x, y, text) {
            commentPopup.textContent = text;
            commentPopup.style.display = 'block';
            const rect = commentPopup.getBoundingClientRect();
            const left = Math.min(x + 12, window.innerWidth - rect.width - 8);
            const top = Math.min(y + 12, window.innerHeight - rect.height - 8);
            commentPopup.style.left = Math.max(8, left) + 'px';
            commentPopup.style.top = Math.max(8, top) + 'px';
        }

        function hideCommentPopup() {
            if (hoverTimer) {
                clearTimeout(hoverTimer);
                hoverTimer = null;
            }
            commentPopup.style.display = 'none';
        }

        modeler.get('eventBus').on('element.hover', (e) => {
            const comment = getComment(e.element);
            if (!comment) return;
            const x = e.originalEvent.clientX;
            const y = e.originalEvent.clientY;
            hideCommentPopup();
            hoverTimer = setTimeout(() => showCommentPopup(x, y, comment), COMMENT_HOVER_DELAY);
        });

        ['element.out', 'element.mousedown', 'canvas.viewbox.changing'].forEach((evt) => {
            modeler.get('eventBus').on(evt, hideCommentPopup);
        });

        // --- Ctrl/Cmd+click opens the linked page -------------------------

        modeler.get('eventBus').on('element.click', (e) => {
            const url = getUrl(e.element);
            if (!url) return;
            if (!e.originalEvent.ctrlKey && !e.originalEvent.metaKey) return;
            e.preventDefault();
            window.open(url, '_blank', 'noopener');
        });

        // --- Zoom controls (like demo.bpmn.io) ---------------------------

        function setupZoomControls(canvasService, containerEl) {
            const ICONS = {
                zoomIn: '<circle cx="10.5" cy="10.5" r="7"></circle>' +
                        '<path d="m16 16 5 5"></path>' +
                        '<path d="M10.5 7.5v6M7.5 10.5h6"></path>',
                zoomOut: '<circle cx="10.5" cy="10.5" r="7"></circle>' +
                         '<path d="m16 16 5 5"></path>' +
                         '<path d="M7.5 10.5h6"></path>',
                reset: '<text x="12" y="15" font-size="9.5" text-anchor="middle" stroke="none" fill="currentColor">1:1</text>',
                fit: '<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"></path>'
            };
            function svg(content) {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                       'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
                       content + '</svg>';
            }
            function center() {
                const viewbox = canvasService.viewbox();
                return { x: viewbox.x + viewbox.width / 2, y: viewbox.y + viewbox.height / 2 };
            }
            function stepZoom(factor) {
                canvasService.zoom(
                    Math.min(4, Math.max(0.2, canvasService.zoom() * factor)), center()
                );
            }
            const controls = [
                { title: 'Zoom in', icon: ICONS.zoomIn, action: () => stepZoom(1.2) },
                { title: 'Zoom out', icon: ICONS.zoomOut, action: () => stepZoom(1 / 1.2) },
                { title: 'Reset zoom (100%)', icon: ICONS.reset, action: () => canvasService.zoom(1.0, center()) },
                { title: 'Fit diagram to screen', icon: ICONS.fit, action: () => canvasService.zoom('fit-viewport') }
            ];
            const strip = document.createElement('div');
            strip.className = 'zoom-controls';
            for (const control of controls) {
                const button = document.createElement('button');
                button.type = 'button';
                button.title = control.title;
                button.innerHTML = svg(control.icon);
                button.addEventListener('click', control.action);
                strip.appendChild(button);
            }
            containerEl.appendChild(strip);
        }

        setupZoomControls(modeler.get('canvas'), document.getElementById('canvas'));

        // --- Export as standalone viewer page ----------------------------

        // Builds a page functionally identical to bpmnSample.html: the current
        // diagram is embedded, links open on click, zoom controls included.
        // The viewer library and styles are embedded too, so the exported
        // page is fully standalone.
        //
        // In bpmnEditor.html the libraries come from a JSON blob injected at
        // build time by scripts/inline-lib.mjs. This page does not carry the
        // blob (it keeps the page light), so it fetches the vendored files
        // from lib/ instead. That works whenever the page is served over
        // HTTP(S) from the same origin. When opened via file://, browsers
        // block these fetches (CORS), so a friendly message is shown and the
        // user is directed to the standalone page.
        let viewerLibPromise = null;

        function loadViewerLib() {
            const libEl = document.getElementById('viewer-lib');
            if (libEl) {
                return Promise.resolve(JSON.parse(libEl.textContent));
            }
            if (location.protocol === 'file:') {
                return Promise.reject(new Error(
                    'export is not available when this page is opened directly from the file ' +
                    'system, because the viewer library cannot be loaded there. ' +
                    'Serve the page over HTTP (for example: npx serve page) or use the ' +
                    'standalone page/bpmnEditor.html, which works offline via file://.'));
            }
            if (!viewerLibPromise) {
                const get = (file) => fetch(file)
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error('could not load lib/' + file + ' (HTTP ' + res.status + ')');
                        }
                        return res.text();
                    });
                viewerLibPromise = Promise.all([
                    get('lib/bpmn-navigated-viewer.development.js'),
                    get('lib/diagram-js.css'),
                    get('lib/bpmn-js.css')
                ]).then(([js, diagramCss, bpmnCss]) => ({ js, diagramCss, bpmnCss }));
            }
            return viewerLibPromise;
        }

        async function buildStandalonePage(title, xml) {
            const lib = await loadViewerLib();
            if (lib.js.indexOf('</' + 'script') !== -1) {
                throw new Error('viewer library cannot be embedded');
            }
            const S = '<' + 'script';
            const CS = '<' + '/script>';
            return '<!DOCTYPE html>\n' +
                '<html lang="en">\n' +
                '<head>\n' +
                '    <meta charset="UTF-8">\n' +
                '    <title>' + title + '</title>\n' +
                '    ' + S + '>\n' + lib.js + '\n    </' + 'script>\n' +
                '    <style>\n' + lib.diagramCss + '\n    </style>\n' +
                '    <style>\n' + lib.bpmnCss + '\n    </style>\n' +
                '    <style>\n' +
                '        html, body { margin: 0; height: 100%; }\n' +
                '        #canvas { height: 100%; border: 1px solid #ddd; position: relative; }\n' +
                '        .djs-element.has-link .djs-hit-stroke,\n' +
                '        .djs-element.has-link .djs-hit-click-stroke,\n' +
                '        .djs-element.has-link .djs-hit-all { cursor: pointer; }\n' +
                '        .djs-element.has-link .djs-visual { filter: drop-shadow(0 0 4px rgba(65, 105, 225, 0.9)); }\n' +
                '        .djs-element.has-comment .djs-visual { filter: drop-shadow(0 0 4px rgba(204, 122, 0, 0.9)); }\n' +
                '        .djs-element.has-link.has-comment .djs-visual { filter: drop-shadow(0 0 4px rgba(123, 79, 184, 0.9)); }\n' +
                '        .zoom-controls {\n' +
                '            position: absolute; right: 15px; bottom: 80px;\n' +
                '            display: flex; flex-direction: column;\n' +
                '            background: #fff; border: 1px solid #ccc; border-radius: 4px;\n' +
                '            box-shadow: 0 1px 2px rgba(0,0,0,.15); overflow: hidden; z-index: 20;\n' +
                '        }\n' +
                '        .zoom-controls button {\n' +
                '            width: 30px; height: 30px; padding: 0; border: none;\n' +
                '            background: #fff; color: #444;\n' +
                '            display: flex; align-items: center; justify-content: center; cursor: pointer;\n' +
                '        }\n' +
                '        .zoom-controls button + button { border-top: 1px solid #e8e8e8; }\n' +
                '        .zoom-controls button:hover { background: #f2f2f2; }\n' +
                '        .zoom-controls svg { width: 16px; height: 16px; }\n' +
                '        #comment-popup {\n' +
                '            position: fixed; z-index: 1000;\n' +
                '            max-width: 300px; max-height: 200px; overflow: auto;\n' +
                '            padding: 0.5rem 0.75rem;\n' +
                '            background: #fffde7; border: 1px solid #d4c65c; border-radius: 4px;\n' +
                '            box-shadow: 0 2px 6px rgba(0,0,0,.2);\n' +
                '            font-size: 0.85rem; font-family: system-ui, sans-serif; white-space: pre-wrap;\n' +
                '            pointer-events: none;\n' +
                '        }\n' +
                '    </style>\n' +
                '</head>\n' +
                '<body>\n' +
                '    <div id="canvas"></div>\n' +
                '\n' +
                '    <script type="text/plain" id="bpmn-data">\n' +
                xml + '\n' +
                '    </' + 'script>\n' +
                '\n' +
                '    ' + S + '>\n' +
                '        const viewer = new BpmnJS({ container: \'#canvas\' });\n' +
                '\n' +
                '        function getUrl(element) {\n' +
                '            const bo = element.businessObject;\n' +
                '            return (bo && bo.$attrs[\'ehub:url\']) || \'\';\n' +
                '        }\n' +
                '        function getComment(element) {\n' +
                '            const bo = element.businessObject;\n' +
                '            return (bo && bo.$attrs[\'ehub:comment\']) || \'\';\n' +
                '        }\n' +
                '        const commentPopup = document.createElement(\'div\');\n' +
                '        commentPopup.id = \'comment-popup\';\n' +
                '        commentPopup.style.display = \'none\';\n' +
                '        document.body.appendChild(commentPopup);\n' +
                '        let hoverTimer = null;\n' +
                '        function showCommentPopup(x, y, text) {\n' +
                '            commentPopup.textContent = text;\n' +
                '            commentPopup.style.display = \'block\';\n' +
                '            const rect = commentPopup.getBoundingClientRect();\n' +
                '            const left = Math.min(x + 12, window.innerWidth - rect.width - 8);\n' +
                '            const top = Math.min(y + 12, window.innerHeight - rect.height - 8);\n' +
                '            commentPopup.style.left = Math.max(8, left) + \'px\';\n' +
                '            commentPopup.style.top = Math.max(8, top) + \'px\';\n' +
                '        }\n' +
                '        function hideCommentPopup() {\n' +
                '            if (hoverTimer) {\n' +
                '                clearTimeout(hoverTimer);\n' +
                '                hoverTimer = null;\n' +
                '            }\n' +
                '            commentPopup.style.display = \'none\';\n' +
                '        }\n' +
                '        viewer.get(\'eventBus\').on(\'element.hover\', (e) => {\n' +
                '            const comment = getComment(e.element);\n' +
                '            if (!comment) return;\n' +
                '            const x = e.originalEvent.clientX;\n' +
                '            const y = e.originalEvent.clientY;\n' +
                '            hideCommentPopup();\n' +
                '            hoverTimer = setTimeout(() => showCommentPopup(x, y, comment), 1000);\n' +
                '        });\n' +
                '        [\'element.out\', \'element.mousedown\', \'canvas.viewbox.changing\'].forEach((evt) => {\n' +
                '            viewer.get(\'eventBus\').on(evt, hideCommentPopup);\n' +
                '        });\n' +
                '\n' +
                '        viewer.get(\'eventBus\').on(\'element.click\', (e) => {\n' +
                '            const url = getUrl(e.element);\n' +
                '            if (url) { window.open(url, \'_blank\', \'noopener\'); }\n' +
                '        });\n' +
                '\n' +
                '        function setupZoomControls(canvasService, containerEl) {\n' +
                '            function center() {\n' +
                '                const v = canvasService.viewbox();\n' +
                '                return { x: v.x + v.width / 2, y: v.y + v.height / 2 };\n' +
                '            }\n' +
                '            function stepZoom(factor) {\n' +
                '                canvasService.zoom(Math.min(4, Math.max(0.2, canvasService.zoom() * factor)), center());\n' +
                '            }\n' +
                '            function svg(c) {\n' +
                '                return \'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">\' + c + \'</svg>\';\n' +
                '            }\n' +
                '            const ICONS = {\n' +
                '                zoomIn: \'<circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/><path d="M10.5 7.5v6M7.5 10.5h6"/>\',\n' +
                '                zoomOut: \'<circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/><path d="M7.5 10.5h6"/>\',\n' +
                '                reset: \'<text x="12" y="15" font-size="9.5" text-anchor="middle" stroke="none" fill="currentColor">1:1</text>\',\n' +
                '                fit: \'<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>\'\n' +
                '            };\n' +
                '            const controls = [\n' +
                '                { title: \'Zoom in\', icon: ICONS.zoomIn, action: () => stepZoom(1.2) },\n' +
                '                { title: \'Zoom out\', icon: ICONS.zoomOut, action: () => stepZoom(1 / 1.2) },\n' +
                '                { title: \'Reset zoom (100%)\', icon: ICONS.reset, action: () => canvasService.zoom(1.0, center()) },\n' +
                '                { title: \'Fit diagram to screen\', icon: ICONS.fit, action: () => canvasService.zoom(\'fit-viewport\') }\n' +
                '            ];\n' +
                '            const strip = document.createElement(\'div\');\n' +
                '            strip.className = \'zoom-controls\';\n' +
                '            for (const control of controls) {\n' +
                '                const button = document.createElement(\'button\');\n' +
                '                button.type = \'button\';\n' +
                '                button.title = control.title;\n' +
                '                button.innerHTML = svg(control.icon);\n' +
                '                button.addEventListener(\'click\', control.action);\n' +
                '                strip.appendChild(button);\n' +
                '            }\n' +
                '            containerEl.appendChild(strip);\n' +
                '        }\n' +
                '\n' +
                '        setupZoomControls(viewer.get(\'canvas\'), document.getElementById(\'canvas\'));\n' +
                '\n' +
                '        const xml = document.getElementById(\'bpmn-data\').textContent.trim();\n' +
                '        viewer.importXML(xml)\n' +
                '            .then(() => {\n' +
                '                viewer.get(\'canvas\').zoom(\'fit-viewport\');\n' +
                '                const canvas = viewer.get(\'canvas\');\n' +
                '                viewer.get(\'elementRegistry\').forEach((element) => {\n' +
                '                    if (element.labelTarget) return;\n' +
                '                    if (getUrl(element)) { canvas.addMarker(element, \'has-link\'); }\n' +
                '                    if (getComment(element)) { canvas.addMarker(element, \'has-comment\'); }\n' +
                '                });\n' +
                '            })\n' +
                '            .catch(err => console.error(\'Could not display BPMN diagram:\', err));\n' +
                '    </' + 'script>\n' +
                '</body>\n' +
                '</html>\n';
        }

        document.getElementById('export').addEventListener('click', async () => {
            try {
                const { xml } = await modeler.saveXML({ format: true });
                if (xml.includes('</script')) {
                    throw new Error('diagram XML cannot be embedded in a page');
                }
                var now = new Date();
                var pad = function (n) { return String(n).padStart(2, '0'); };
                var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
                       + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
                const safeName = 'BpmnViewer' + ts;
                const html = await buildStandalonePage('BPMN \u2013 ' + safeName, xml);
                const blob = new Blob([html], { type: 'text/html' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = safeName + '.html';
                a.click();
                URL.revokeObjectURL(a.href);
                statusEl.textContent = 'Exported ' + safeName + '.html \u2013 fully standalone, no lib/ folder needed.';
            } catch (err) {
                statusEl.textContent = 'Export failed: ' + err.message;
            }
        });

        // --- Download the standalone editor --------------------------------
        // bpmnEditor.html sits next to this page (repo checkout and GitHub
        // Pages both ship it). Offer it as a download so file:// users get
        // the fully standalone editor in one click. On file:// the fetch is
        // blocked by browsers, so the button just points at the file.
        const downloadBtn = document.getElementById('download-standalone');

        if (document.getElementById('viewer-lib')) {
            // We are the generated standalone page: downloading another copy
            // of this very page would be redundant.
            downloadBtn.style.display = 'none';
        } else {
            downloadBtn.addEventListener('click', async () => {
                if (location.protocol === 'file:') {
                    statusEl.textContent = 'The standalone editor is the file bpmnEditor.html ' +
                        'located next to this page (in the page/ folder of the repository).';
                    return;
                }
                try {
                    const res = await fetch('bpmnEditor.html');
                    if (!res.ok) {
                        throw new Error('HTTP ' + res.status);
                    }
                    const blob = new Blob([await res.text()], { type: 'text/html' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'bpmnEditor.html';
                    a.click();
                    URL.revokeObjectURL(a.href);
                    statusEl.textContent = 'Downloaded bpmnEditor.html \u2013 fully standalone, works offline via file://.';
                } catch (err) {
                    statusEl.textContent = 'Download failed: ' + err.message +
                        ' \u2013 the file is bpmnEditor.html, next to this page.';
                }
            });
        }

        // --- Load ---------------------------------------------------------

        openDiagram(document.getElementById('bpmn-data').textContent.trim());
    </script>
</body>
</html>
