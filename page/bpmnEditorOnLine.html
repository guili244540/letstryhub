    <!--
      Light variant: the bpmn-js library and styles are loaded from lib/
      next to this page, so this file stays small. It works offline via
      file:// as long as the lib/ folder travels with it. The "Export page"
      button needs to fetch lib/ files, which browsers only allow when the
      page is served over HTTP; on file:// it shows a message instead.

    <script id="export-template">
// Single source of truth for the standalone viewer page template.
//
// Used by:
//   - src/export-page.js (Vite online editor, lib imported at build time)
//   - page/bpmnEditorOnLine.html / page/bpmnEditor.html (standalone editor,
//     lib from the #viewer-lib blob or fetched from lib/)
//   - scripts/inline-lib.mjs (generates page/bpmnSample.html)
//
// The file is deliberately dependency-free: it has no imports, so it can run
// as a plain ES module (Node, Vite) and can be inlined verbatim into the
// editor pages by scripts/inline-lib.mjs. For that reason it must never
// contain the closing-tag sequence of a script or style element anywhere,
// not even inside a string or a comment: the HTML parser would end the host
// page's script block early. Hence the split "<" + "/script" forms below.

function buildStandaloneViewerPage({ title, xml, lib, modules }) {
  // Assembled at runtime, never written literally: see the header comment.
  const SCRIPT_CLOSE = '<' + '/script';
  const STYLE_CLOSE = '<' + '/style';
  for (const [name, content] of [
    ['title', title],
    ['diagram XML', xml],
    ['viewer library', lib.js],
    ['diagram-js.css', lib.diagramCss],
    ['bpmn-js.css', lib.bpmnCss],
    ['style module', modules.style],
    ['popup module', modules.popup],
    ['links module', modules.links],
    ['zoom module', modules.zoom]
  ]) {
    if (String(content).includes(SCRIPT_CLOSE) || String(content).includes(STYLE_CLOSE)) {
      throw new Error(`${name} contains a closing tag and cannot be embedded`);
    }
  }

  const S = '<' + 'script';

  const viewerScript = `
        const viewer = new BpmnJS({ container: '#canvas' });

        // Page CSS, attribute helpers, click-to-open, canvas markers,
        // popup DOM, the flat popup text builder and zoom controls all
        // come from the shared modules embedded above as plain script
        // blocks (single sources under src/, forwarded by every caller of
        // the template). The template inlines nothing by hand anymore.
        setupCommentPopup(viewer.get('eventBus'), buildFlatPopupText);
        registerOpenLinks(viewer.get('eventBus'), { ctrlRequired: false });
        setupZoomControls(viewer.get('canvas'), document.getElementById('canvas'));

        const xml = document.getElementById('bpmn-data').textContent.trim();
        viewer.importXML(xml)
            .then(() => {
                viewer.get('canvas').zoom('fit-viewport');
                const canvas = viewer.get('canvas');
                viewer.get('elementRegistry').getAll().forEach((element) => {
                    updateContentMarkers(canvas, element);
                });
            })
            .catch(err => console.error('Could not display BPMN diagram:', err));`;
  return `<!DOCTYPE html>
<html lang="en" data-canvas-border>
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
    ${S}>${lib.js}
    </${''}script>
    <style>${lib.diagramCss}</style>
    <style>${lib.bpmnCss}</style>
</head>
<body>
    <div id="canvas"></div>

    <script type="text/plain" id="bpmn-data">
${xml}
    </${''}script>

    ${S}>${modules.style}
    </${''}script>

    ${S}>${modules.popup}
    </${''}script>

    ${S}>${modules.links}
    </${''}script>

    ${S}>${modules.zoom}
    </${''}script>

    ${S}>${viewerScript}
    </${''}script>
</body>
</html>
`;
}
    </script>

const CANVAS_BORDER_CSS = `
#canvas {
  border: 1px solid #ddd;

/* Keep the modeling palette (tool column, top-left) fully visible

// Idempotent: creates the <style> element once, reuses and rewrites it
// afterwards, so a second call with different options stays correct.
function ensurePageStyle({ canvasBorder } = {}) {
  if (canvasBorder === undefined) {
    canvasBorder = document.documentElement.hasAttribute('data-canvas-border');
  }
  const css = PAGE_STYLE_CSS + (canvasBorder ? CANVAS_BORDER_CSS : '') + PALETTE_CSS;
  let style = document.getElementById(PAGE_STYLE_ID);

    <script id="comment-popup-module">
// Single source of the comment-popup CSS (EVOLUTION.md, slice 1).
//
// The popup styles are owned by this module and injected at runtime as a
// <style id="comment-popup-style"> element, so no surface carries a
// hand-maintained copy: the Vite app imports this module, and the
// standalone pages receive it verbatim in the #comment-popup-style marker
// block refilled by scripts/inline-lib.mjs.
//
// The file is deliberately dependency-free (no imports, no Vite-specific
// syntax) and must never contain the closing-tag sequence of a script or
// style element anywhere, not even inside a comment: it runs both as an ES
// module and as a plain inlined script block.

const COMMENT_POPUP_STYLE_ID = 'comment-popup-style';

const COMMENT_POPUP_CSS = `
#comment-popup {
  position: fixed;
  z-index: 1000;
  max-width: 300px;
  max-height: 200px;
  overflow: auto;
  padding: 0.5rem 0.75rem;
  background: #fffde7;

  white-space: pre-wrap;
}

#comment-popup #comment-popup-close {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  padding: 0;
  border: none;
  background: transparent;
  color: #7a6a1c;
  font-size: 14px;
  line-height: 18px;
  text-align: center;
  cursor: pointer;
}

  background: #efe6a0;
  border-radius: 3px;
}

#comment-popup #comment-popup-content {
  max-height: 180px;
  overflow: auto;
  padding-right: 12px;
  scrollbar-width: thin;
}
`;

// Idempotent: creates the <style> element once, reuses it afterwards.
function ensureCommentPopupStyle() {
  let style = document.getElementById(COMMENT_POPUP_STYLE_ID);
  if (!style) {
    style = document.createElement('style');
    style.id = COMMENT_POPUP_STYLE_ID;
    style.textContent = COMMENT_POPUP_CSS;
    document.head.appendChild(style);
  }
  return style;
}

// Shared hover-popup: shows the comment and every filled properties field
// (all except the link) of an element as a fixed-position popup after
// hovering it for a short delay. Used by the Modeler (via
// properties-panel), the Viewer and the standalone/exported pages, so the
// interaction stays identical on every surface. The popup itself stays
// interactive so long texts can be scrolled; it closes via its X button or
// when the pointer leaves it.
// Moving the pointer from the element towards the popup crosses other
// diagram elements (e.g. the parent of a nested element), which would
// otherwise hide the popup before the cursor reaches it; hiding is
// therefore delayed by a short grace period that is cancelled as soon
// as the pointer enters the popup.
//
// This module is the single source of the popup DOM/logic (EVOLUTION.md,
// slice 1). It is deliberately dependency-free and injects its own styles
// via src/comment-popup-style.js (kept in a separate file only because
// src/export-template.js cannot concatenate modules at runtime; it embeds
// both files in sequence). It must never contain the closing-tag sequence
// of a script or style element: scripts/inline-lib.mjs inlines it verbatim
// into the standalone pages after stripping the export keywords.


const COMMENT_HOVER_DELAY_MS = 1000;
const COMMENT_HIDE_DELAY_MS = 300;

// Builds the popup text for the hovered element. Passed in by each caller
// because the attribute-access helpers live per surface today
// (src/links.js in the Vite app, local helpers in the standalone pages
// until the later EVOLUTION.md slices unify them too).
function setupCommentPopup(eventBus, buildPopupText) {
  ensureCommentPopupStyle();

  const popup = document.createElement('div');
  popup.id = 'comment-popup';
  popup.style.display = 'none';

  const closeButton = document.createElement('button');
  closeButton.id = 'comment-popup-close';
  closeButton.type = 'button';
  closeButton.setAttribute('aria-label', 'Close');
  closeButton.textContent = '\u00d7';
  closeButton.addEventListener('click', () => {
    hovered = false;
    hide();
  });
  popup.appendChild(closeButton);

  const content = document.createElement('div');
  content.id = 'comment-popup-content';
  popup.appendChild(content);

  document.body.appendChild(popup);

  let hoverTimer = null;
  let hideTimer = null;
  let hovered = false;

  popup.addEventListener('mouseenter', () => {
    if (hideTimer) {
      clearTimeout(hideTimer);
      hideTimer = null;
    }
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    hovered = true;
  });
  popup.addEventListener('mouseleave', () => {
    hovered = false;
    hide();
  });

  function show(x, y, text) {
    if (hideTimer) {
      clearTimeout(hideTimer);
      hideTimer = null;
    }
    content.textContent = text;
    popup.style.display = 'block';
    const rect = popup.getBoundingClientRect();
    const left = Math.min(x + 12, window.innerWidth - rect.width - 8);
    const top = Math.min(y + 12, window.innerHeight - rect.height - 8);
    popup.style.left = Math.max(8, left) + 'px';
    popup.style.top = Math.max(8, top) + 'px';
  }

  function hide() {
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    if (hideTimer) {
      clearTimeout(hideTimer);
      hideTimer = null;
    }
    popup.style.display = 'none';
  }

  // Hide after a grace period so the pointer can travel from the element
  // to the popup without the popup vanishing mid-way. Any pending show
  // timer for a newly hovered element is left untouched: only the visible
  // popup is hidden, the upcoming one must still appear.
  function hideSoon() {
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      hideTimer = null;
      popup.style.display = 'none';
    }, COMMENT_HIDE_DELAY_MS);
  }

  function hideIfNotHovered() {
    if (!hovered) hideSoon();
  }

  eventBus.on('element.hover', (event) => {
    hideSoon();
    const text = buildPopupText(event.element);
    if (!text) return;
    const { clientX: x, clientY: y } = event.originalEvent;
    hoverTimer = setTimeout(() => show(x, y, text), COMMENT_HOVER_DELAY_MS);
  });

  ['canvas.viewbox.changing'].forEach((name) => {
    eventBus.on(name, hideIfNotHovered);
  });
  eventBus.on('element.mousedown', hide);
}
    </script>

    <!-- Link helpers, click-to-open and canvas markers: injected from
         src/links.js by scripts/inline-lib.mjs (single source shared with
         the Vite app and the exported pages). Must run before the
         #properties-panel-module block, whose links import is stripped. -->
    <script id="links-module">
// Shared helpers for reading/writing the custom ehub:* attributes.

function getElementText(element, attr) {
  const bo = element.businessObject;
  if (!bo) return null;
  return bo.get(attr) || bo.$attrs[attr] || null;
}

function getElementUrl(element) {
  return getElementText(element, 'ehub:url');
}

function getElementComment(element) {
  return getElementText(element, 'ehub:comment');
}

// Fields shown in the hover popup after the comment, in display order.
const POPUP_FIELDS = [
  { attr: 'ehub:input', label: 'Input' },
  { attr: 'ehub:output', label: 'Output' },
  { attr: 'ehub:validation', label: 'Validation' },
  { attr: 'ehub:exception', label: 'Exception' }
];

const POPUP_IMPLEMENTATION_FIELDS = [
  { attr: 'ehub:implementationCurrent', label: 'Current' },
  { attr: 'ehub:implementationTarget', label: 'Target' },
  { attr: 'ehub:implementationTargetMethod', label: 'Target method' }
];

// Build the hover-popup text: the comment first, then every other
// properties field that has a value (all except the link).
function buildPopupText(element) {
  const parts = [];
  const comment = getElementComment(element);
  if (comment) parts.push(comment);
  for (const field of POPUP_FIELDS) {
    const value = getElementText(element, field.attr);
    if (value) parts.push(field.label + ':\n' + value);
  }
  const impl = POPUP_IMPLEMENTATION_FIELDS
    .map((field) => ({ field, value: getElementText(element, field.attr) }))
    .filter((entry) => entry.value);
  if (impl.length) {
    parts.push('Implementation:\n' + impl
      .map((entry) => '  ' + entry.field.label + ':\n    ' + entry.value)
      .join('\n'));
  }
  return parts.join('\n\n');
}

// Flat variant of the popup text used by the standalone surfaces: like
// buildPopupText but without the grouped "Implementation:" block, every
// field on its own line. implPrefix is prepended to the implementation
// field labels only, because the surfaces label them differently: the
// exported pages say "Current", the standalone editor says
// "Implementation – Current" (kept per surface on purpose, like
// ctrlRequired — parameterize, do not unify silently).
function buildFlatPopupText(element, implPrefix = '') {
  const parts = [];
  const comment = getElementComment(element);
  if (comment) parts.push(comment);
  for (const field of [...POPUP_FIELDS, ...POPUP_IMPLEMENTATION_FIELDS]) {
    const isImpl = POPUP_IMPLEMENTATION_FIELDS.includes(field);
    const label = (isImpl ? implPrefix : '') + field.label;
    const value = getElementText(element, field.attr);
    if (value) parts.push(label + ':\n' + value);
  }
  return parts.join('\n\n');
}

function isUrlElement(element) {
  return !!getElementUrl(element);
}

// Keep the has-link / has-comment canvas markers in sync with the element's
// ehub:url / ehub:comment attributes, so flagged elements are recognizable
// without hovering. Marker names map 1:1 to the CSS rules injected by
// src/page-style.js on every surface.
function updateContentMarkers(canvas, element) {
  if (!element || element.labelTarget || !element.businessObject) return;
  const hasLink = isUrlElement(element);
  const hasComment = !!getElementComment(element);
  canvas[hasLink ? 'addMarker' : 'removeMarker'](element, 'has-link');
  canvas[hasComment ? 'addMarker' : 'removeMarker'](element, 'has-comment');
}

// Register a click handler that opens the external URL of an element.
// Works in both Modeler and Viewer; exported so pages can hook extra logic.
function registerOpenLinks(eventBus, { ctrlRequired = true } = {}) {
  eventBus.on('element.click', (event) => {
    const { element } = event;
    const url = getElementUrl(element);
    if (!url) return;
    if (ctrlRequired && !event.originalEvent.ctrlKey && !event.originalEvent.metaKey) return;
    event.preventDefault();
    window.open(url, '_blank', 'noopener');
  });
}

    <!-- Zoom control strip: injected from src/zoom-controls.js by
         scripts/inline-lib.mjs (single source shared with the Vite app and
         the exported pages) -->
    <script id="zoom-controls-module">
// Zoom control strip (bottom-right of the canvas, above the bpmn.io
// watermark), like the one on demo.bpmn.io. Attaches itself to the
// given container element.

const ICONS = {
  zoomIn:
    '<circle cx="10.5" cy="10.5" r="7"></circle>' +
    '<path d="m16 16 5 5"></path>' +
    '<path d="M10.5 7.5v6M7.5 10.5h6"></path>',
  zoomOut:
    '<circle cx="10.5" cy="10.5" r="7"></circle>' +
    '<path d="m16 16 5 5"></path>' +
    '<path d="M7.5 10.5h6"></path>',
  reset: '<text x="12" y="15" font-size="9.5" text-anchor="middle" stroke="none" fill="currentColor">1:1</text>',
  fit: '<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"></path>'
};

function svg(content) {
  return (
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    content +
    '</svg>'
  );
}

function setupZoomControls(canvasService, containerEl) {
  const MIN_ZOOM = 0.2;
  const MAX_ZOOM = 4;
  const STEP = 1.2;

  function center() {
    const viewbox = canvasService.viewbox();
    return {
      x: viewbox.x + viewbox.width / 2,
      y: viewbox.y + viewbox.height / 2
    };
  }

  function stepZoom(factor) {
    canvasService.zoom(
      Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, canvasService.zoom() * factor)),
      center()
    );
  }

  const controls = [
    { title: 'Zoom in', icon: ICONS.zoomIn, action: () => stepZoom(STEP) },
    { title: 'Zoom out', icon: ICONS.zoomOut, action: () => stepZoom(1 / STEP) },
    { title: 'Reset zoom (100%)', icon: ICONS.reset, action: () => canvasService.zoom(1.0, center()) },
    { title: 'Fit diagram to screen', icon: ICONS.fit, action: () => canvasService.zoom('fit-viewport') }
  ];

  const strip = document.createElement('div');
  strip.className = 'zoom-controls';

  for (const control of controls) {
    const button = document.createElement('button');
    button.type = 'button';
    button.title = control.title;
    button.innerHTML = svg(control.icon);
    button.addEventListener('click', control.action);
    strip.appendChild(button);
  }

  containerEl.appendChild(strip);
  return strip;
}
    </script>

    <!-- Properties side panel: injected from src/properties-panel.js by
         scripts/inline-lib.mjs (single source shared with the Vite app;
         the panel DOM is built at runtime by the module) -->
    <script id="properties-panel-module">
// Side properties panel for the selected element (link and comment today,
// more fields later). This avoids pulling in the full properties-panel for
// the demo; swap it later for bpmn-js-properties-panel if you need a richer
// UI.
//
// Single source of the panel (EVOLUTION.md, slice 2): the Vite editor
// imports it, and the standalone editor pages receive it in the
// #properties-panel-module marker block refilled by scripts/inline-lib.mjs.
// The links.js import below is stripped there; the helpers are provided by
// the #links-module block that runs before this one.

const TEXT_FIELDS = [
  { attr: 'ehub:input', label: 'Input', placeholder: 'Input\u2026' },
  { attr: 'ehub:output', label: 'Output', placeholder: 'Output\u2026' },
  { attr: 'ehub:validation', label: 'Validation', placeholder: 'Validation\u2026' },
  { attr: 'ehub:exception', label: 'Exception', placeholder: 'Exception\u2026' }
];

const IMPLEMENTATION_FIELDS = [
  { attr: 'ehub:implementationCurrent', label: 'Current', placeholder: 'Current\u2026' },
  { attr: 'ehub:implementationTarget', label: 'Target', placeholder: 'Target\u2026' },
  { attr: 'ehub:implementationTargetMethod', label: 'Target method', placeholder: 'Target method\u2026' }
];

// The module only owns the panel; each caller wires the hover popup
// (setupCommentPopup) with its own text builder, because the surfaces
// label the fields differently today (src/links.js groups the
// implementation fields; the standalone editor page prefixes each label).
function setupPropertiesPanel(modeler, panelEl) {
  const modeling = modeler.get('modeling');
  const eventBus = modeler.get('eventBus');

  const heading = document.createElement('h3');
  heading.textContent = 'Properties';

  function makeField(field) {
    const label = document.createElement('label');
    label.textContent = field.label;
    label.htmlFor = field.attr;
    const input = document.createElement('textarea');
    input.id = field.attr;
    input.rows = 2;
    input.maxLength = 1000;
    input.placeholder = field.placeholder;
    input.style.width = '100%';
    input.style.display = 'none';
    label.style.display = 'none';
    input.addEventListener('change', () => {
      if (!current) return;
      modeling.updateProperties(current, { [field.attr]: input.value || undefined });
    });
    field.labelEl = label;
    field.inputEl = input;
  }

  const noneSelected = document.createElement('p');
  noneSelected.textContent = 'Select an element to edit its properties.';

  const implHeading = document.createElement('h4');
  implHeading.textContent = 'Implementation';
  implHeading.style.margin = '0.75rem 0 0';
  implHeading.style.fontSize = '0.85rem';
  implHeading.style.display = 'none';

  const label = document.createElement('label');
  label.textContent = 'Link';
  label.htmlFor = 'link-input';

  const input = document.createElement('input');
  input.type = 'url';
  input.id = 'link-input';
  input.placeholder = 'https://example.org/docs';
  input.style.width = '100%';

  const commentLabel = document.createElement('label');
  commentLabel.textContent = 'Comment';
  commentLabel.htmlFor = 'comment-input';

  const commentInput = document.createElement('textarea');
  commentInput.id = 'comment-input';
  commentInput.rows = 4;
  commentInput.maxLength = 1000;
  commentInput.placeholder = 'Type a comment\u2026';
  commentInput.style.width = '100%';

  [...TEXT_FIELDS, ...IMPLEMENTATION_FIELDS].forEach(makeField);

  panelEl.append(
    heading,
    noneSelected,
    label,
    input,
    commentLabel,
    commentInput
  );
  for (const field of TEXT_FIELDS) {
    panelEl.append(field.labelEl, field.inputEl);
  }
  panelEl.append(implHeading);
  for (const field of IMPLEMENTATION_FIELDS) {
    panelEl.append(field.labelEl, field.inputEl);
  }

  label.style.display = 'none';
  input.style.display = 'none';
  commentLabel.style.display = 'none';
  commentInput.style.display = 'none';
  noneSelected.style.display = 'block';

  let current = null;

  eventBus.on('selection.changed', ({ newSelection }) => {
    current = newSelection.length === 1 ? newSelection[0] : null;
    render();
  });

  input.addEventListener('change', () => {
    if (!current) return;
    modeling.updateProperties(current, { 'ehub:url': input.value || undefined });
  });

  commentInput.addEventListener('change', () => {
    if (!current) return;
    modeling.updateProperties(current, { 'ehub:comment': commentInput.value || undefined });
  });

  function render() {
    if (current) {
      noneSelected.style.display = 'none';
      label.style.display = 'block';
      input.style.display = 'block';
      input.value = getElementUrl(current) || '';
      commentLabel.style.display = 'block';
      commentInput.style.display = 'block';
      commentInput.value = getElementComment(current) || '';
      implHeading.style.display = 'block';
      for (const field of [...TEXT_FIELDS, ...IMPLEMENTATION_FIELDS]) {
        field.labelEl.style.display = 'block';
        field.inputEl.style.display = 'block';
        field.inputEl.value = getElementText(current, field.attr) || '';
      }
    } else {
      noneSelected.style.display = 'block';
      label.style.display = 'none';
      input.style.display = 'none';
      commentLabel.style.display = 'none';
      commentInput.style.display = 'none';
      implHeading.style.display = 'none';
      for (const field of [...TEXT_FIELDS, ...IMPLEMENTATION_FIELDS]) {
        field.labelEl.style.display = 'none';
        field.inputEl.style.display = 'none';
      }
    }
  }
}
    </script>

    </script>

    <script>
        // Custom BPMN extension: an ehub:url attribute valid on any element.
        // It is stored inside the .bpmn file itself, so the viewer page can
        // read it too (even without this descriptor, via $attrs).
        const ehubModdle = {
            name: 'Ehub',
            prefix: 'ehub',
            uri: 'https://letstryhub.example/bpmn/ehub',
            xml: { tagAlias: 'lowerCase' },
            types: [
                {
                    name: 'Linked',
                    extends: [ 'bpmn:BaseElement' ],
                    properties: [
                        { name: 'url', isAttr: true, type: 'String' },
                        { name: 'comment', isAttr: true, type: 'String' },
                        { name: 'input', isAttr: true, type: 'String' },
                        { name: 'output', isAttr: true, type: 'String' },
                        { name: 'validation', isAttr: true, type: 'String' },
                        { name: 'exception', isAttr: true, type: 'String' },
                        { name: 'implementationCurrent', isAttr: true, type: 'String' },
                        { name: 'implementationTarget', isAttr: true, type: 'String' },
                        { name: 'implementationTargetMethod', isAttr: true, type: 'String' }
                    ]
                }
            ]
        };

        const modeler = new BpmnJS({
            container: '#canvas',
            moddleExtensions: { ehub: ehubModdle },
            additionalModules: [
                BpmnJsExtras.CreateAppendAnythingModule,
                BpmnJsExtras.colorPickerModule
            ],
            keyboard: { bindTo: document }
        });

        const statusEl = document.getElementById('status');

        // Keep the has-link / has-comment canvas markers in sync with the
        // elements' ehub:url / ehub:comment attributes, like the Vite app
        // (src/modeler.js). updateContentMarkers comes from the
        // #links-module block above (single source: src/links.js).
        modeler.get('eventBus').on('element.changed', (event) => {
            updateContentMarkers(modeler.get('canvas'), event.element);
        });

        async function openDiagram(xml) {
            try {
                await modeler.importXML(xml);
                const canvas = modeler.get('canvas');
                for (const element of modeler.get('elementRegistry').getAll()) {
                    updateContentMarkers(canvas, element);
                }
                statusEl.textContent = 'Diagram loaded.';
            } catch (err) {
                statusEl.textContent = 'Failed to load: ' + err.message;
                console.error(err);
            }
        }

        // --- Open / Save -------------------------------------------------

        document.getElementById('open').addEventListener('click', () => {
            document.getElementById('open-file').click();
        });

        document.getElementById('open-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                file.text().then(openDiagram);
            }
            e.target.value = '';
        });

        document.getElementById('save').addEventListener('click', async () => {
            try {
                const { xml } = await modeler.saveXML({ format: true });
                var now = new Date();
                var pad = function (n) { return String(n).padStart(2, '0'); };
                var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
                       + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
                const fileName = 'BpmnSource' + ts;
                const blob = new Blob([ xml ], { type: 'application/xml' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${fileName}.bpmn`;
                a.click();
                URL.revokeObjectURL(a.href);
                statusEl.textContent = `Saved ${fileName}.bpmn.`;
            } catch (err) {
                statusEl.textContent = 'Failed to save: ' + err.message;
            }
        });

        // --- Properties side panel toggle -------------------------------

        document.getElementById('toggle-panel').addEventListener('click', () => {
            var panel = document.getElementById('properties-panel');
            var btn = document.getElementById('toggle-panel');
            var show = panel.style.display === 'none';
            panel.style.display = show ? '' : 'none';
            btn.classList.toggle('active', show);
            btn.setAttribute('aria-pressed', String(show));
        });

        // --- Comment popup on hover (after ~1s) --------------------------

        // Popup DOM, styles, hover timing and the text builder all come
        // from the shared modules in the marker blocks above (single
        // source: src/). Only the implementation-field label prefix is
        // page-specific here ("Implementation – ", unlike the flat
        // labels of the exported pages), so it is passed as a parameter
        // to the shared builder.
        setupCommentPopup(modeler.get('eventBus'), function (element) {
            return buildFlatPopupText(element, 'Implementation \u2013 ');
        });

        // --- Shared behaviors: links, panel, zoom ------------------------

        // Ctrl/Cmd+click opens the linked page; the properties side panel
        // and the zoom strip all come from the shared modules injected into
        // the marker blocks in <head> (single sources: src/links.js,
        // src/properties-panel.js, src/zoom-controls.js — same modules the
        // Vite app imports).
        registerOpenLinks(modeler.get('eventBus'));
        setupPropertiesPanel(modeler, document.getElementById('properties-panel'));
        setupZoomControls(modeler.get('canvas'), document.getElementById('canvas'));

        // --- Export as standalone viewer page ----------------------------

        // Builds a page functionally identical to bpmnSample.html: the current
        // diagram is embedded, links open on click, zoom controls included.
        // The viewer library and styles are embedded too, so the exported
        // page is fully standalone.
        //
        // In bpmnEditor.html the libraries come from a JSON blob injected at
        // build time by scripts/inline-lib.mjs. This page does not carry the
        // blob (it keeps the page light), so it fetches the vendored files
        // from lib/ instead. That works whenever the page is served over
        // HTTP(S) from the same origin. When opened via file://, browsers
        // block these fetches (CORS), so a friendly message is shown and the
        // user is directed to the standalone page.
        let viewerLibPromise = null;

        function loadViewerLib() {
            const libEl = document.getElementById('viewer-lib');
            if (libEl) {
                return Promise.resolve(JSON.parse(libEl.textContent));
            }
            if (location.protocol === 'file:') {
                return Promise.reject(new Error(
                    'export is not available when this page is opened directly from the file ' +
                    'system, because the viewer library cannot be loaded there. ' +
                    'Serve the page over HTTP (for example: npx serve page) or use the ' +
                    'standalone page/bpmnEditor.html, which works offline via file://.'));
            }
            if (!viewerLibPromise) {
                const get = (file) => fetch(file)
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error('could not load lib/' + file + ' (HTTP ' + res.status + ')');
                        }
                        return res.text();
                    });
                viewerLibPromise = Promise.all([
                    get('lib/bpmn-navigated-viewer.development.js'),
                    get('lib/diagram-js.css'),
                    get('lib/bpmn-js.css')
                ]).then(([js, diagramCss, bpmnCss]) => ({ js, diagramCss, bpmnCss }));
            }
            return viewerLibPromise;
        }

        async function buildStandalonePage(title, xml) {
            const lib = await loadViewerLib();
            // The template is injected into the #export-template block by
            // scripts/inline-lib.mjs from src/export-template.js (the same
            // single source the Vite app uses). The shared modules embedded
            // by the same script into the marker blocks are passed along
            // verbatim, so exported pages derive from src/ too.
            const modules = {
                style: document.getElementById('page-style-module').textContent,
                links: document.getElementById('links-module').textContent,
                zoom: document.getElementById('zoom-controls-module').textContent,
                popup: document.getElementById('comment-popup-module').textContent
            };
            return buildStandaloneViewerPage({ title: title, xml: xml, modules: modules, lib: lib });
        }

        document.getElementById('export').addEventListener('click', async () => {
            try {
                const { xml } = await modeler.saveXML({ format: true });
                if (xml.includes('</script')) {
                    throw new Error('diagram XML cannot be embedded in a page');
                }
                var now = new Date();
                var pad = function (n) { return String(n).padStart(2, '0'); };
                var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
                       + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
                const safeName = 'BpmnViewer' + ts;
                const html = await buildStandalonePage('BPMN \u2013 ' + safeName, xml);
                const blob = new Blob([html], { type: 'text/html' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = safeName + '.html';
                a.click();
                URL.revokeObjectURL(a.href);
                statusEl.textContent = 'Exported ' + safeName + '.html \u2013 fully standalone, no lib/ folder needed.';
            } catch (err) {
                statusEl.textContent = 'Export failed: ' + err.message;
            }
        });

        // --- Download the standalone editor --------------------------------
        // bpmnEditor.html sits next to this page (repo checkout and GitHub
        // Pages both ship it). Offer it as a download so file:// users get
        // the fully standalone editor in one click. On file:// the fetch is
        // blocked by browsers, so the button just points at the file.
        const downloadBtn = document.getElementById('download-standalone');

        if (document.getElementById('viewer-lib')) {
            // We are the generated standalone page: downloading another copy
            // of this very page would be redundant.
            downloadBtn.style.display = 'none';
        } else {
            downloadBtn.addEventListener('click', async () => {
                if (location.protocol === 'file:') {
                    statusEl.textContent = 'The standalone editor is the file bpmnEditor.html ' +
                        'located next to this page (in the page/ folder of the repository).';
                    return;
                }
                try {
                    const res = await fetch('bpmnEditor.html');
                    if (!res.ok) {
                        throw new Error('HTTP ' + res.status);
                    }
                    const blob = new Blob([await res.text()], { type: 'text/html' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'bpmnEditor.html';
                    a.click();
                    URL.revokeObjectURL(a.href);
                    statusEl.textContent = 'Downloaded bpmnEditor.html \u2013 fully standalone, works offline via file://.';
                } catch (err) {
                    statusEl.textContent = 'Download failed: ' + err.message +
                        ' \u2013 the file is bpmnEditor.html, next to this page.';
                }
            });
        }

        // --- Load ---------------------------------------------------------

        openDiagram(document.getElementById('bpmn-data').textContent.trim());
    </script>
</body>
</html>
